<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Tadpole Doctor</title>
        <style>
        body, html {
        height: 100%;
        margin: 0;
        font-family: 'Cinzel Decorative', serif;
        color: #F2E2D2;
        text-shadow: 4px 4px 4px #aaa;
        }
        .bg {
        /* The image used */
        background-image: url("frog.jpg");
        /* Full height */
        height: 100%;
        /* Center and scale the image nicely */
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        }
        /* Centered text */
        .centered {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        }
        </style>
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Cinzel+Decorative">
    </head>
    <body>
        <div class="bg"></div>
        <div class="centered">
            <h1 style="font-size:6vw;">Tadpole Doctor</h1>
            <p style="font-size:2vw;">Website Coming Soon</p>
        </div>
